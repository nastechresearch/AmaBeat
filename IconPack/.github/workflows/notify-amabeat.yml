name: Trigger AmaBeat build

on:
  push:
    branches: [ main ]
    paths:
      - 'svg/**'
      - 'metadata.json'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to AmaBeat
        env:
          TOKEN: ${{ secrets.AMABEAT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a AMABEAT_DISPATCH_TOKEN secret (PAT with Contents: read & write on AmaBeat)."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nastechresearch/AmaBeat/dispatches \
            -d '{"event_type":"iconpack-updated","client_payload":{"sha":"${{ github.sha }}"}}'
